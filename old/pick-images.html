<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Picker — Clawd v2</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 40px 32px 120px;
    }
    h1 { font-size: 1.8em; font-weight: 800; margin-bottom: 0.2em; }
    .subtitle { opacity: 0.5; margin-bottom: 2em; }
    .slide-section {
      margin-bottom: 3em;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.5em;
    }
    .slide-section h2 { font-size: 1.2em; font-weight: 600; margin-bottom: 0.3em; }
    .slide-desc { font-size: 0.85em; opacity: 0.4; margin-bottom: 0.4em; }
    .slide-notes { font-size: 0.8em; opacity: 0.55; color: #e46a43; margin-bottom: 1em; font-style: italic; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
      aspect-ratio: 16/9;
      background: #181818;
    }
    .card:hover { transform: scale(1.02); }
    .card.selected { border-color: #e46a43; }
    .card.selected::after {
      content: '\2713';
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e46a43;
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .img-label {
      position: absolute;
      bottom: 8px; left: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff; font-size: 12px;
      padding: 2px 8px; border-radius: 4px;
    }
    .tag {
      position: absolute; top: 8px; left: 8px;
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      font-weight: 600; color: #fff;
    }
    .tag + .tag { left: auto; right: auto; position: relative; display: inline-block; margin-left: 4px; }
    .tags-row {
      position: absolute; top: 8px; left: 8px;
      display: flex; gap: 4px; z-index: 2;
    }
    .tag-recommended { background: rgba(228,106,67,0.85); }
    .tag-generated { background: rgba(26,188,156,0.85); }
    .tag-existing { background: rgba(100,100,100,0.85); }
    .tag-noimage { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
    .card-noimage {
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1em; opacity: 0.4; font-style: italic;
    }
    #output-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(20,20,20,0.95);
      border-top: 1px solid rgba(255,255,255,0.15);
      padding: 16px 32px;
      display: flex; align-items: center; gap: 16px;
      backdrop-filter: blur(12px); z-index: 100;
    }
    #output-bar .count { font-size: 0.95em; opacity: 0.7; }
    #output-bar button {
      background: #e46a43; color: #fff; border: none;
      padding: 10px 24px; border-radius: 8px;
      font-family: inherit; font-size: 1em; font-weight: 600; cursor: pointer;
    }
    #output-bar button:hover { background: #d05a35; }
    #json-output {
      display: none;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 24px;
      margin-top: 2em; font-family: monospace; font-size: 0.85em;
      white-space: pre-wrap; word-break: break-all; line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Clawd v2 — Background Image Picker</h1>
  <p class="subtitle">Click to select one image per slide. Selections saved in localStorage.</p>
  <div id="sections"></div>
  <div id="json-output"></div>
  <div id="output-bar">
    <span class="count" id="selection-count">0 selected</span>
    <button onclick="showSelections()">Show Selections</button>
    <button onclick="copySelections()">Copy JSON</button>
  </div>
  <script>
    const slides = [
      {
        id: "s01-title",
        title: 'Slide 1: Title \u2014 "When Intelligence Grew Hands"',
        desc: "Opening. Cinematic, dark, sets the tone.",
        notes: "\u2605 Recommended: crab claws from dark water (existing). Perfect match.",
        images: [
          { url: "images/00-title.jpg", label: "Crab claws from water (existing)", tags: ["recommended", "existing"] },
          { url: "images/01-brain-in-jar.jpg", label: "Brain in jar (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s02-elephant",
        title: 'Slide 2: The Elephant \u2014 "Am I replaceable?"',
        desc: "Tension, unease. The questions everyone is thinking.",
        notes: "\u2605 Recommended: new generated empty chair. 5/5 \u2014 Fincher-level.",
        images: [
          { url: "images/02-elephant-chair.jpg", label: "Empty chair + desk lamp (generated)", tags: ["recommended", "generated"] },
          { url: "images/04-empty-office.jpg", label: "Night office skyline (existing)", tags: ["existing"] },
          { url: "images/bg-05-silhouette.jpg", label: "Silhouette (existing)", tags: ["existing"] },
          { url: "images/bg-05-contemplation.jpg", label: "Contemplation (existing)", tags: ["existing"] },
          { url: "images/bg-05-reflection.jpg", label: "Reflection (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s03-shift",
        title: "Slide 3: The Shift \u2014 Before \u2192 Now",
        desc: "Consult vs. direct. Brain in jar = the 'before'.",
        notes: "\u2605 Recommended: brain in jar at low opacity + HTML overlay for Before/Now.",
        images: [
          { url: "images/01-brain-in-jar.jpg", label: "Brain in jar \u2014 the 'before' (existing)", tags: ["recommended", "existing"] },
          { url: "images/bg-02-crossroads.jpg", label: "Crossroads (existing)", tags: ["existing"] },
          { url: "images/bg-03-crossroads-new.jpg", label: "Crossroads new (existing)", tags: ["existing"] },
          { url: "images/bg-02-dark-path.jpg", label: "Dark path (existing)", tags: ["existing"] },
          { url: "images/bg-02-dark-road.jpg", label: "Dark road / windshield (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s04-hands",
        title: 'Slide 4: Hands \u2014 "Tools plus loops"',
        desc: "What 'hands' means concretely. Write, browse, run, loop.",
        notes: "\u2605 Recommended: robotic hand reaching from darkness (generated v2). 4.5/5.",
        images: [
          { url: "images/04-robot-hand-v2.jpg", label: "Robotic hand reaching (generated v2)", tags: ["recommended", "generated"] },
          { url: "images/04-robot-hands.jpg", label: "Robot hands at desk (generated v1 \u2014 busy)", tags: ["generated"] },
          { url: "images/bg-04-hands-meaning.jpg", label: "Welder hands (existing)", tags: ["existing"] },
          { url: "images/bg-03-keyboard.jpg", label: "Keyboard (existing)", tags: ["existing"] },
          { url: "images/bg-03-workshop.jpg", label: "Workshop tools (existing)", tags: ["existing"] },
          { url: "images/bg-03-craftsman.jpg", label: "Skull + candles (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s05-loop",
        title: "Slide 5: The Loop \u2014 Agent loop diagram",
        desc: "Goal \u2192 Context \u2192 Plan \u2192 Act \u2192 Observe \u2192 Evaluate \u2192 Loop",
        notes: "SVG diagram on pure black. No photographic image needed.",
        images: [
          { url: null, label: "No image \u2014 SVG diagram only", tags: ["recommended", "noimage"] },
        ]
      },
      {
        id: "s06-story",
        title: 'Slide 6: The W-9 Story \u2014 "A ridiculous way to fill out a form"',
        desc: "Human moment. Funny, relatable. AI confidently wrong.",
        notes: "\u2605 Recommended: no bg image. Let the story breathe. Dark slide, white text.",
        images: [
          { url: null, label: "No image \u2014 text only (recommended)", tags: ["recommended", "noimage"] },
          { url: "images/04-empty-office.jpg", label: "Office (subtle bg option)", tags: ["existing"] },
        ]
      },
      {
        id: "s07-drift",
        title: 'Slide 7: Drift \u2014 "Noise that feels like progress"',
        desc: "The scariest part. AI leading you without noticing. WELDR story.",
        notes: "\u2605 Recommended: night drive through windshield. 5/5 \u2014 perfect drift metaphor.",
        images: [
          { url: "images/bg-02-dark-road.jpg", label: "Night drive windshield (existing)", tags: ["recommended", "existing"] },
          { url: "images/bg-09-foggy-path.jpg", label: "Foggy field (existing)", tags: ["existing"] },
          { url: "images/bg-09-foggy-forest.jpg", label: "Winter forest (existing)", tags: ["existing"] },
          { url: "images/bg-09-labyrinth.jpg", label: "Labyrinth (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s08-conviction",
        title: 'Slide 8: Conviction \u2014 "AI revealed what my work actually was"',
        desc: "Judgment is the bottleneck. Quiet, warm, grounded.",
        notes: "Craft shaving is gorgeous but needs dark overlay. Wood plane needs darkening. Or generate another.",
        images: [
          { url: "images/08-craft-shaving-v2.jpg", label: "Wood shaving close-up (generated v2 \u2014 needs overlay)", tags: ["generated"] },
          { url: "images/08-craft-plane.jpg", label: "Wood plane on bench (generated v1 \u2014 bright)", tags: ["generated"] },
          { url: "images/07-texture-future.jpg", label: "Future texture (existing)", tags: ["existing"] },
          { url: "images/bg-03-workshop.jpg", label: "Workshop tools (existing)", tags: ["existing"] },
          { url: null, label: "No image \u2014 text only", tags: ["noimage"] },
        ]
      },
      {
        id: "s09-trust",
        title: "Slide 9: Trust \u2014 Scope / Visibility / Reversibility",
        desc: "Framework slide. Three pillars. Readable > atmospheric.",
        notes: "\u2605 Recommended: clean HTML/SVG layout, no photographic bg.",
        images: [
          { url: null, label: "No image \u2014 HTML/SVG pillars (recommended)", tags: ["recommended", "noimage"] },
          { url: "images/bg-12-trust-new.jpg", label: "Trust (existing)", tags: ["existing"] },
          { url: "images/bg-12-bridge-fog.jpg", label: "Bridge in fog (existing)", tags: ["existing"] },
          { url: "images/bg-12-tightrope.jpg", label: "Tightrope (existing)", tags: ["existing"] },
          { url: "images/bg-12-anchor.jpg", label: "Anchor (existing)", tags: ["existing"] },
        ]
      },
      {
        id: "s10-close",
        title: 'Slide 10: Close \u2014 "Give it hands. Keep the steering wheel."',
        desc: "Final moment. Powerful, quiet. Let the image land.",
        notes: "\u2605 Recommended: two robotic hands reaching (existing). 5/5 \u2014 Michelangelo.",
        images: [
          { url: "images/12-closing.jpg", label: "Two hands reaching (existing)", tags: ["recommended", "existing"] },
          { url: "images/00-title.jpg", label: "Crab claws \u2014 bookend (existing)", tags: ["existing"] },
        ]
      },
    ];

    let selections = {};
    try { selections = JSON.parse(localStorage.getItem('imgPickerV2') || '{}'); } catch(e) {}

    function render() {
      const container = document.getElementById('sections');
      container.innerHTML = '';
      slides.forEach(slide => {
        const section = document.createElement('div');
        section.className = 'slide-section';
        section.innerHTML =
          '<h2>' + slide.title + '</h2>' +
          '<p class="slide-desc">' + slide.desc + '</p>' +
          '<p class="slide-notes">' + slide.notes + '</p>' +
          '<div class="grid" id="grid-' + slide.id + '"></div>';
        container.appendChild(section);
        const grid = section.querySelector('.grid');

        slide.images.forEach(function(img, i) {
          var card = document.createElement('div');
          card.className = 'card';
          if (selections[slide.id] === String(i)) card.classList.add('selected');

          if (img.url) {
            var imgEl = document.createElement('img');
            imgEl.loading = 'lazy';
            imgEl.src = img.url;
            imgEl.alt = img.label;
            card.appendChild(imgEl);
          } else {
            card.classList.add('card-noimage');
            card.textContent = 'No image';
          }

          var tagsRow = document.createElement('div');
          tagsRow.className = 'tags-row';
          (img.tags || []).forEach(function(t) {
            var tag = document.createElement('span');
            tag.className = 'tag tag-' + t;
            tag.textContent = t === 'recommended' ? '\u2605 PICK' : t === 'generated' ? 'AI GEN' : t === 'existing' ? 'EXISTING' : 'NO IMG';
            tagsRow.appendChild(tag);
          });
          card.appendChild(tagsRow);

          var label = document.createElement('span');
          label.className = 'img-label';
          label.textContent = img.label;
          card.appendChild(label);

          card.addEventListener('click', function() {
            card.parentElement.querySelectorAll('.card').forEach(function(c) { c.classList.remove('selected'); });
            card.classList.add('selected');
            selections[slide.id] = String(i);
            localStorage.setItem('imgPickerV2', JSON.stringify(selections));
            updateCount();
          });
          grid.appendChild(card);
        });
      });
      updateCount();
    }

    function updateCount() {
      var n = Object.keys(selections).length;
      document.getElementById('selection-count').textContent = n + ' / ' + slides.length + ' selected';
    }

    function getSelectionsDetail() {
      var result = {};
      slides.forEach(function(slide) {
        var idx = selections[slide.id];
        if (idx === undefined) return;
        var img = slide.images[parseInt(idx)];
        result[slide.id] = { slide: slide.title, file: img.url, label: img.label, tags: img.tags };
      });
      return result;
    }

    function showSelections() {
      var el = document.getElementById('json-output');
      el.style.display = 'block';
      el.textContent = JSON.stringify(getSelectionsDetail(), null, 2);
      el.scrollIntoView({ behavior: 'smooth' });
    }

    function copySelections() {
      var text = JSON.stringify(getSelectionsDetail(), null, 2);
      navigator.clipboard.writeText(text).then(function() {
        var btn = document.querySelector('#output-bar button:last-child');
        var orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = orig; }, 1500);
      });
    }

    render();
  </script>
</body>
</html>
