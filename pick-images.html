<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Picker — Clawd Presentation</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 40px 32px 120px;
    }
    h1 { font-size: 1.8em; font-weight: 800; margin-bottom: 0.2em; }
    .subtitle { opacity: 0.5; margin-bottom: 2em; }
    .slide-section {
      margin-bottom: 3em;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.5em;
    }
    .slide-section h2 {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 0.3em;
    }
    .slide-section .search-term {
      font-size: 0.85em;
      opacity: 0.4;
      margin-bottom: 1em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color 0.2s, transform 0.15s;
      aspect-ratio: 16/9;
      background: #181818;
    }
    .card:hover { transform: scale(1.02); }
    .card.selected { border-color: #e46a43; }
    .card.selected::after {
      content: '\2713';
      position: absolute;
      top: 10px;
      right: 10px;
      background: #e46a43;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card .img-index {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .existing-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(228,106,67,0.85);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    #output-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20,20,20,0.95);
      border-top: 1px solid rgba(255,255,255,0.15);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    #output-bar .count {
      font-size: 0.95em;
      opacity: 0.7;
    }
    #output-bar button {
      background: #e46a43;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
    }
    #output-bar button:hover { background: #d05a35; }
    #json-output {
      display: none;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 24px;
      margin-top: 2em;
      font-family: monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }
  </style>
</head>

  <div id="json-output"></div>

    <button onclick="copySelections()">Copy JSON</button>

    // Load saved selections
    let selections = {};
    try { selections = JSON.parse(localStorage.getItem('imgPickerSelections') || '{}'); } catch(e) {}

    function render() {
      const container = document.getElementById('sections');
      container.innerHTML = '';

      slides.forEach(slide => {
        const section = document.createElement('div');
        section.className = 'slide-section';
        section.innerHTML = `
          <h2>${slide.title}</h2>
          <p class="search-term">Search: "${slide.search}"</p>
          <div class="grid" id="grid-${slide.id}"></div>
        `;
        container.appendChild(section);

        const grid = section.querySelector('.grid');

        // Show existing image first if any
        if (slide.existing) {
          const card = makeCard(slide.id, slide.existing, 'current');
          const label = document.createElement('span');
          label.className = 'existing-label';
          label.textContent = 'CURRENT';
          card.appendChild(label);
          grid.appendChild(card);
        }

        // Show unsplash candidates
        slide.images.forEach((url, i) => {
          grid.appendChild(makeCard(slide.id, url, i));
        });
      });

      updateCount();
    }

    function makeCard(slideId, url, index) {
      const card = document.createElement('div');
      card.className = 'card';
      if (selections[slideId] === String(index)) {
        card.classList.add('selected');
      }

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = url;
      img.alt = '';
      card.appendChild(img);

      const badge = document.createElement('span');
      badge.className = 'img-index';
      badge.textContent = index === 'current' ? 'current' : `#${index + 1}`;
      card.appendChild(badge);

      card.addEventListener('click', () => {
        // Deselect siblings
        card.parentElement.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selections[slideId] = String(index);
        localStorage.setItem('imgPickerSelections', JSON.stringify(selections));
        updateCount();
      });

      return card;
    }

    function updateCount() {
      const n = Object.keys(selections).length;
      document.getElementById('selection-count').textContent = `${n} / ${slides.length} selected`;
    }

    function getSelectionsDetail() {
      const result = {};
      slides.forEach(slide => {
        const idx = selections[slide.id];
        if (idx === undefined) return;
        if (idx === 'current') {
          result[slide.id] = { slide: slide.title, url: slide.existing, source: 'current' };
        } else {
          result[slide.id] = { slide: slide.title, url: slide.images[parseInt(idx)], source: 'unsplash' };
        }
      });
      return result;
    }

    function showSelections() {
      const el = document.getElementById('json-output');
      el.style.display = 'block';
      el.textContent = JSON.stringify(getSelectionsDetail(), null, 2);
      el.scrollIntoView({ behavior: 'smooth' });
    }

    function copySelections() {
      const text = JSON.stringify(getSelectionsDetail(), null, 2);
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('#output-bar button:last-child');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    render();
